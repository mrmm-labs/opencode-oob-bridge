name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Version and changelog come from conventional commits via the manifest.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      # Tool versions from mise.toml.
      - uses: jdx/mise-action@v2
      - run: mise run build
      - run: mise run test
      - name: Pack
        id: pack
        run: |
          file=$(npm pack --silent)
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "${{ steps.pack.outputs.file }}" "${{ steps.pack.outputs.file }}.sha256" --clobber

  # Optional: pushes the relay image to a private registry named only by secrets.
  # The first step masks every derived value, no step prints a reference, and the
  # script filters the output of each command. Nothing runs when a secret is unset.
  relay-image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      RELAY_REGISTRY: ${{ secrets.RELAY_REGISTRY }}
      RELAY_REGISTRY_USER: ${{ secrets.RELAY_REGISTRY_USER }}
      RELAY_REGISTRY_TOKEN: ${{ secrets.RELAY_REGISTRY_TOKEN }}
      RELAY_IMAGE_PATH: ${{ secrets.RELAY_IMAGE_PATH }}
      RELAY_TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Mask and check
        id: gate
        run: |
          if [ -n "${RELAY_REGISTRY}" ] && [ -n "${RELAY_REGISTRY_USER}" ] && [ -n "${RELAY_REGISTRY_TOKEN}" ]; then
            echo "::add-mask::${RELAY_REGISTRY}"
            echo "::add-mask::${RELAY_REGISTRY%%/*}"
            [ -z "${RELAY_IMAGE_PATH}" ] || echo "::add-mask::${RELAY_IMAGE_PATH}"
            echo "::add-mask::${RELAY_REGISTRY%/}/${RELAY_IMAGE_PATH:-oob-relay}:${RELAY_TAG}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.enabled == 'true'
        name: Build and push
        run: bash scripts/relay-push.sh
