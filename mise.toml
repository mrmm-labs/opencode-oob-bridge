[tools]
node = "24"
pnpm = "10.32.1"
"npm:@fission-ai/openspec" = "1.16.1"

[tasks.install]
description = "Install dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.build]
depends = ["install"]
run = "pnpm run build"

[tasks.test]
depends = ["install"]
run = "pnpm test"

[tasks.lint]
depends = ["install"]
run = ["pnpm run typecheck", "pnpm run lint"]

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test", "build"]
run = ["npm pack --dry-run"]
